services:
  bootstrap-node:
    build: .
    container_name: bootstrap-node
    environment:
      - NODE_BOOTSTRAP=true
      - NODE_PORT=12137
    ports:
      - "12137:12137"
    stdin_open: true
    tty: true
    networks:
      - onion-network

  peer:
    build: .
    environment:
      - BOOTSTRAP_HOST=bootstrap-node
      - NODE_PORT=12210
    depends_on:
      - bootstrap-node
    stdin_open: true
    tty: true
    networks:
      - onion-network

  peer1:
    build: .
    container_name: peer1
    environment:
      - BOOTSTRAP_HOST=bootstrap-node
      - NODE_PORT=12211
    ports:
          - "12211:12211"
    depends_on:
      - bootstrap-node
    stdin_open: true
    tty: true
    networks:
      - onion-network

  peer2:
    build: .
    container_name: peer2
    environment:
      - BOOTSTRAP_HOST=bootstrap-node
      - NODE_PORT=12212
    ports:
      - "12212:12212"
    depends_on:
      - bootstrap-node
    stdin_open: true
    tty: true
    networks:
      - onion-network

  peer3:
    build: .
    container_name: peer3
    environment:
      - BOOTSTRAP_HOST=bootstrap-node
      - NODE_PORT=12213
    ports:
      - "12213:12213"
    depends_on:
      - bootstrap-node
    stdin_open: true
    tty: true
    networks:
      - onion-network

networks:
  onion-network:
    driver: bridge